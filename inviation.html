<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Sandy 💕</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 2rem 1.5rem;
      border-radius: 25px;
      max-width: 360px;
      width: 92%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      animation: float 4s ease-in-out infinite;
      position: relative;
      z-index: 2;
    }

    .card.hide {
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 { color: #e63946; margin-bottom: 0.2rem; }
    h2 { color: #ff4d6d; margin-top: 0; font-size: 1.2rem; }

    .heart {
      font-size: 3.2rem;
      margin: 1rem 0;
      animation: beat 1.2s infinite;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    p { color: #555; line-height: 1.6; margin: 0.8rem 0; }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.5rem;
      position: relative;
    }

    button {
      padding: 0.7rem 1.4rem;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .yes { background: #ff4d6d; color: white; }
    .yes:hover { background: #e63946; transform: scale(1.1); }

    .no {
      background: #ffd6e0;
      color: #555;
      position: absolute;
    }

    footer { margin-top: 1.3rem; font-size: 0.8rem; color: #888; }

    /* YES SCREEN */
    .yes-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #ff4d6d, #ffb6c1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 5;
    }

    .yes-screen.show {
      opacity: 1;
      pointer-events: auto;
    }

    .message {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
      margin-top: 1rem;
      font-size: 1.8rem;
    }

    .letter {
      opacity: 0;
      transform: scale(0);
      animation: reveal 0.6s forwards;
    }

    @keyframes reveal {
      to {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    .heart-fall {
      position: fixed;
      top: -20px;
      font-size: 1.5rem;
      animation: fall linear forwards;
      z-index: 10;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <audio id="bgm" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7c3b8a1f3a.mp3?filename=romantic-ambient-112191.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="card">
    <h1>Sandy 💖</h1>
    <h2>I have a question…</h2>
    <div class="heart">💗</div>
    <p><strong>Will you be my Valentine?</strong></p>

    <div class="buttons">
      <button class="yes" id="yesBtn">Yes 💕</button>
      <button class="no" id="noBtn">No 🙈</button>
    </div>

    <footer>— From Reden 💕</footer>
  </div>

  <div class="yes-screen" id="yesScreen">
    <h1>She said YES 💖</h1>
    <p>Best Valentine’s ever 💕</p>

    <!-- I LOVE YOU SANDY -->
    <div class="message" id="message"></div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const yesScreen = document.getElementById('yesScreen');
    const card = document.getElementById('card');
    const music = document.getElementById('bgm');
    const messageEl = document.getElementById('message');

    const message = '💖 I 💖 L O V E 💖 Y O U 💖 S A N D Y 💖'.split(' ');

    function moveNo(btn) {
      const rect = card.getBoundingClientRect();
      const x = Math.random() * (rect.width - btn.offsetWidth);
      const y = Math.random() * (rect.height - btn.offsetHeight);
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
    }

    noBtn.addEventListener('mouseover', () => moveNo(noBtn));
    noBtn.addEventListener('click', e => { e.preventDefault(); moveNo(noBtn); });
    noBtn.addEventListener('focus', () => moveNo(noBtn));

    yesBtn.addEventListener('click', () => {
      card.classList.add('hide');
      yesScreen.classList.add('show');
      startHearts();
      revealMessage();
    });

    function revealMessage() {
      messageEl.innerHTML = '';
      message.forEach((char, i) => {
        const span = document.createElement('span');
        span.className = 'letter';
        span.textContent = char;
        span.style.animationDelay = i * 0.2 + 's';
        messageEl.appendChild(span);
      });
    }

    function startHearts() {
      const interval = setInterval(() => {
        const heart = document.createElement('div');
        heart.className = 'heart-fall';
        heart.textContent = '💖';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = 2 + Math.random() * 2 + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
      }, 200);

      setTimeout(() => clearInterval(interval), 5000);
    }

    document.body.addEventListener('click', () => {
      music.play().catch(() => {});
    }, { once: true });
  </script>

</body>
</html>
